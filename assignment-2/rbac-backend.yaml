apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
    tier: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-role-binding
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: dso202-assignment-01
roleRef:
  kind: Role
  name: backend-role
  apiGroup: rbac.authorization.k8s.io
