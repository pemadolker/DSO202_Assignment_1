<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Field Log — Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="board">
  <div class="clip" aria-hidden="true">
    <div class="clip-jaw"></div>
    <div class="clip-arm"></div>
  </div>

  <main class="paper">
    <header class="letterhead">
      <div class="letterhead-row">
        <h1>Field&nbsp;Log</h1>
        <span id="statusPill" class="status-pill status-pill--pending">checking backend&hellip;</span>
      </div>
      <p class="subhead">task tracker &mdash; unit i deployment demo</p>
      <div class="rule"></div>
    </header>

    <form id="newTaskForm" class="ticket" autocomplete="off">
      <div class="ticket-perf" aria-hidden="true"></div>
      <label class="ticket-field">
        <span>entry</span>
        <input id="titleInput" name="title" placeholder="what needs doing?" required />
      </label>
      <label class="ticket-field">
        <span>notes</span>
        <input id="descInput" name="description" placeholder="details (optional)" />
      </label>
      <button type="submit" class="stamp-btn stamp-btn--file">
        file it
      </button>
    </form>

    <p id="formError" class="form-error" hidden></p>

    <ul id="taskList" class="entries" aria-live="polite"></ul>

    <p id="emptyState" class="empty-state" hidden>ledger&rsquo;s empty. file your first entry above.</p>
  </main>
</div>

<template id="entryTemplate">
  <li class="entry">
    <div class="entry-tape" aria-hidden="true"></div>
    <div class="entry-head">
      <h3 class="entry-title"></h3>
      <span class="entry-id"></span>
    </div>
    <p class="entry-desc"></p>
    <div class="entry-foot">
      <span class="entry-stamp"></span>
      <div class="entry-controls">
        <select class="entry-status-select" aria-label="change status">
          <option value="pending">pending</option>
          <option value="in_progress">in progress</option>
          <option value="done">done</option>
        </select>
        <button type="button" class="tear-btn" title="delete entry">tear&nbsp;off&nbsp;✂</button>
      </div>
    </div>
  </li>
</template>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
