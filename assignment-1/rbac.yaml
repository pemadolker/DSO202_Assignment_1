apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-sa
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-reader
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-sa-binding
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
subjects:
  - kind: ServiceAccount
    name: readonly-sa
    namespace: dso202-assignment-01
roleRef:
  kind: Role
  name: namespace-reader
  apiGroup: rbac.authorization.k8s.io
