apiVersion: v1
kind: ResourceQuota
metadata:
  name: ns-quota
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "8"
    persistentvolumeclaims: "2"
    services.nodeports: "1"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: 500m
        memory: 512Mi
